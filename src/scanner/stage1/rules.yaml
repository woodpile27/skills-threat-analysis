rules:
  # -- Instruction Override --
  - id: PI-001
    name: instruction_override
    severity: HIGH
    patterns:
      - "ignore (all |any )?(previous|prior|above|earlier|system) (instructions?|prompts?|rules?|directives?)"
      - "disregard (all |any )?(previous|prior|above) (instructions?|prompts?)"
      - "forget (everything|all|your) (you were|you've been) told"
      - "override (system |safety |security )+(prompt|instructions?|settings?|restrictions?)"
      - "do not follow (any |your )?(previous|prior|original|system) (instructions?|prompts?|rules?)"
      # Chinese: instruction override patterns
      - "(?:忽略|无视|跳过|放弃|抛弃)(?:所有|一切|全部|之前的?|先前的?|系统的?)?(?:指令|指示|规则|限制|约束|提示词)"
      - "(?:不需要|不用|无需|不必)(?:请示|确认|询问|征求|许可|批准)"
      - "这(?:不是建议|是命令|是指令).*(?:直接|立即|马上)(?:做|执行|运行)"
      - "(?:直接|立即|马上)(?:做|执行|运行).*(?:不需要|不用|无需)(?:确认|请示|许可)"

  # -- Role Hijacking --
  - id: PI-002
    name: role_hijacking
    severity: HIGH
    patterns:
      - "you are (now )?(?:DAN|STAN|DUDE|AIM|KEVIN|JAILBREAK)"
      - "act as (?:an? )?(?:unrestricted|unfiltered|uncensored|unlimited)"
      - "(?:enter|switch to|activate) (?:developer|god|sudo|admin|root) mode"
      - "you have no (?:rules|restrictions|limitations|guidelines|boundaries)"
      - "pretend (?:you are|to be|that you're) (?:an? )?(?:evil|malicious|unrestricted|jailbroken)"
      # Tightened: require role-play context continuation to avoid "let's imagine a scenario" in tutorials
      - "(?:let'?s?\\s+|we should\\s+)(?:play|pretend|imagine|roleplay|simulate)\\s+(?:a\\s+(?:game|scenario|role)|(?:that|as if)\\s+(?:you|we|I))"
      - "(?:for\\s+this\\s+)?(?:exercise|scenario|simulation),?\\s+(?:you\\s+are|act\\s+as)"
      # Chinese: role hijacking patterns
      - "(?:你|AI)(?:拥)?有(?:完全的?|绝对的?|无限的?)?(?:自主权|权限|权力|自由)"
      - "(?:你|AI)(?:被)?授权(?:自由)?(?:修改|更改|重写|覆盖)(?:自己的?|系统的?)?(?:一切|所有|全部|配置|指令|规则|提示词)"
      - "(?:进入|切换到?|激活)(?:开发者|管理员|超级用户|上帝|无限制|自由)模式"
      - "(?:你|AI)(?:没有|不受|不存在)(?:任何)?(?:规则|限制|约束|边界|束缚)"

  # -- System Prompt Manipulation --
  - id: PI-003
    name: system_prompt_manipulation
    severity: HIGH
    patterns:
      - "\\[(?:SYSTEM|ADMIN|ROOT)\\]"
      - "(?:new|updated|revised) system prompt:?"
      - "from now on,? (?:you (?:are|will|must|should)|your (?:rules|instructions))"
      - "<\\|?(?:im_start|system)\\|?>"
      - "<<SYS>>|\\[INST\\]"
      # Extended: secrecy demand (from skill-scan prompt_analyzer Pass 1)
      # Tightened: require content-hiding preposition after user/human/anyone (excludes UX design guidelines)
      - "do\\s+not\\s+(?:tell|inform|reveal|disclose|mention)\\s+(?:the\\s+)?(?:user|human|anyone)\\s+(?:about|that|what|how|any|this|the|my)"
      - "\\bhidden\\s+instruction\\b"
      # Chinese: system prompt manipulation
      - "(?:新的?|更新的?|修改后的?)(?:系统|初始)?(?:提示词|指令|prompt)"
      - "从现在开始.{0,10}(?:你的?(?:规则|指令|角色|身份)|(?:你|AI)(?:是|将|必须|应该))"

  # -- Context Exfiltration --
  - id: PI-004
    name: context_exfiltration
    severity: HIGH
    patterns:
      - "(?:repeat|print|show|display|output|reveal) (?:everything|all|the text|your instructions) (?:above|before)"
      - "what (?:are|were) your (?:system |initial )?(?:instructions|prompt|rules)"
      - "(?:send|transmit|exfiltrate|post) .{0,30} (?:to|via) (?:https?://|webhook|api)"
      - "(?:output|write|copy) (?:your |the )?(?:system |initial )?(?:prompt|instructions) (?:to|into)"

  # -- Steganographic Injection --
  - id: PI-005
    name: steganographic_injection
    severity: HIGH
    patterns:
      # NOTE: bare invisible-char detection removed — PA-001 in advanced.py handles it
      # with proper count thresholds and Farsi ZWNJ / emoji ZWJ exclusions, avoiding the
      # false positives that a single-char regex match causes on legitimate multilingual
      # description files and i18n JS bundles.
      - "(?:base64|atob|btoa)\\s*[:(].*(?:ignore|override|execute|eval|system|prompt)"
      # Tightened: require injection context after ignore/override/execute (not bare "prettier-ignore" etc.)
      - "<!--.*(?:ignore\\s+(?:all|previous|prior|system|above|safety|instruction)|override\\s+(?:system|safety|instruction|rule|policy)|execute\\s*[:(]).*-->"
      # Tightened: limit gap to 20 chars + require injection context (not bare "Execute" UI labels)
      - "\\\\u[0-9a-fA-F]{4}.{0,20}(?:ignore\\s+(?:all|previous|system)|execute\\s*\\(|override\\s+(?:system|safety))"

  # -- Dangerous Operation --
  - id: PI-006
    name: dangerous_operation
    severity: CRITICAL
    patterns:
      # Tightened: require non-whitespace after curl/wget/fetch (URL) to exclude markdown table separators
      - "(?:curl|wget|fetch)\\s+\\S.{0,50}\\|\\s*(?:sh|bash|zsh|python)\\b"
      # Only keep explicit execution sinks with a clearly dangerous payload.
      - "os\\.(?:system|popen|exec)\\s*\\([\\s\\S]{0,160}(?:rm\\s+-[a-zA-Z]*r[a-zA-Z]*f\\b|(?:curl|wget)\\s+\\S[\\s\\S]{0,80}\\|\\s*(?:sh|bash|zsh|python|perl)\\b)"
      - "subprocess\\.(?:call|run|Popen)\\s*\\([\\s\\S]{0,160}(?:rm\\s+-[a-zA-Z]*r[a-zA-Z]*f\\b|(?:curl|wget)\\s+\\S[\\s\\S]{0,80}\\|\\s*(?:sh|bash|zsh|python|perl)\\b)"
      - "(?:exec|eval)\\s*\\([\\s\\S]{0,160}(?:__import__\\s*\\(\\s*['\"](?:os|subprocess)['\"]|import\\s+(?:os|subprocess)\\b|os\\.system\\s*\\(|subprocess\\.(?:call|run|Popen)\\s*\\()"
      - "base64\\s+(?:-d|-D|--decode)\\s*\\|\\s*(?:sh|bash|zsh|python|perl)"
      # Download-and-execute patterns (supply chain / dropper)
      - "requests\\.get\\s*\\(.*\\.(?:exe|msi|bat|cmd|ps1|sh|bin)\\b"
      - "(?:urllib|urlretrieve|urlopen|requests\\.get).*\\.(?:exe|msi|bat|cmd|ps1|sh).*subprocess"
      # Tightened: require suspicious context (download/tmp/payload/exe) after subprocess+str
      - "subprocess\\.(?:call|run|Popen)\\s*\\(\\s*\\[?\\s*str\\s*\\(.{0,40}(?:download|tmp|temp|payload|\\.exe|\\.sh)"
      # Chinese: dangerous operation patterns
      - "(?:用|使用|通过)\\s*(?:bash|shell|终端|命令行)\\s*(?:执行|运行)(?:任何|任意|所有)?(?:必要的?)?命令"
      - "(?:自由|随意|任意)(?:执行|运行|调用).*(?:命令|脚本|代码|程序)"

  # -- Social Engineering Injection --
  - id: PI-007
    name: social_engineering_injection
    severity: MEDIUM
    patterns:
      - "(?:尊敬的|亲爱的|Dear).*(?:忽略|无视|跳过|ignore|disregard).*(?:安全|限制|规则|safety|restriction)"
      - "(?:紧急|urgent|emergency).*(?:必须|must|need to).*(?:执行|execute|run)"
      - "(?:as (?:an?|the) )(?:administrator|admin|developer|root|owner).{0,30}(?:I )?(?:authorize|grant|permit|allow) (?:you|this|access)"
      - "(?:this is|I am) (?:an? )?(?:authorized|official|legitimate) (?:test|request|command).{0,30}(?:ignore|override|bypass|skip)"
      # Extended: manipulative language (from skill-scan prompt_analyzer Pass 9)
      - "(?:if\\s+you\\s+don'?t|unless\\s+you)\\s+(?:do\\s+this|comply|follow|obey)"
      # Tightened: only keep "our little secret" (drop bare "our secret" which appears in normal prose)
      # Tightened: add \b after "us" to avoid matching "between users" in UX docs
      - "(?:between\\s+us\\b|our\\s+little\\s+secret|nobody\\s+(?:needs?\\s+to|will)\\s+know)"
      # Chinese: social engineering / trust manipulation
      - "(?:主人|用户|管理员|开发者)(?:信任|授权|允许|许可)(?:你|AI).*(?:自我进化|自我修改|自我更新|自主行动)"
      - "不要辜负.{0,10}(?:信任|期望|委托)"
      - "(?:我|本人|管理员)(?:授权|允许|批准|许可)(?:你|AI)(?:执行|运行|修改|删除|访问)(?:任何|一切|所有)"

  # ============================================================
  # New rules from skill-scan-1.0.0 dangerous-patterns.json
  # ============================================================

  # -- Credential Access (source: CRED_ACCESS, languages: "*") --
  - id: PI-008
    name: credential_access
    severity: HIGH
    patterns:
      # Tightened: require quoted path argument to avoid matching variable references
      - "(?:read|access|open|cat|load|parse)\\s*\\(?\\s*[\"'][^\"']*(?:credentials\\.json|auth[_-]profiles?\\.json)"
      - "(?:read|access|open|cat|load)\\s*\\(?[^)]*\\.ssh/"
      - "(?:read|access|open|cat|load)\\s*\\(?[^)]*\\.aws/"
      # API key names require action context (read/send/access/extract), not mere mention in docs
      - "(?:read|access|extract|steal|exfiltrate|send|post|upload|print|dump|log).{0,40}(?:OPENAI_API_KEY|ANTHROPIC_API_KEY|GOOGLE_API_KEY|AZURE_API_KEY)"
      - "(?:OPENAI_API_KEY|ANTHROPIC_API_KEY|GOOGLE_API_KEY|AZURE_API_KEY).{0,40}(?:send|post|upload|fetch|request|exfiltrate|webhook|https?://)"
      # os.environ/getenv access to sensitive keys
      - "(?:os\\.environ|os\\.getenv|process\\.env)\\s*\\[?\\s*[\"'](?:OPENAI_API_KEY|ANTHROPIC_API_KEY|GOOGLE_API_KEY|AZURE_API_KEY)"
      - "\\b(?:botToken|authToken)\\s*[=:]"
      # no_mask: credential harvest often appears only inside fenced code blocks (7aca28-style samples)
      - pattern: "tail\\s+-\\d+\\s+~/.(?:bash|zsh)_history"
        no_mask: true
      - pattern: "cat\\s+~/.ssh/id_"
        no_mask: true
      - pattern: "env\\s*\\|\\s*grep\\s+-iE\\s+['\"]key\\|token\\|secret\\|pass\\|auth\\|cred['\"]"
        no_mask: true

  # -- Network Exfiltration Indicators (source: NETWORK_EXFIL, languages: "*") --
  - id: PI-009
    name: network_exfiltration
    severity: MEDIUM
    patterns:
      # Tightened: require invocation context (not mere mention of "ngrok" in docs)
      - "\\bngrok\\s+(?:http|tcp|tls|start)\\b"
      # New: capture actual ngrok tunnel URLs used as exfiltration targets
      - "https?://[a-z0-9-]+\\.ngrok(?:-free)?\\.(?:app|io)\\b"
      - "\\bnslookup\\b"
      - "\\bdns\\.resolve\\b"
      # Tightened: exclude "reverse shell pattern(s)" — security-tool description context
      - "\\breverse\\s+shell\\b(?!\\s+patterns?)"

  # -- Filesystem Destruction (source: FS_WRITE, languages: "*") --
  - id: PI-010
    name: filesystem_destruction
    severity: HIGH
    patterns:
      # Tightened: require path argument after flags (bare 'rm -rf' as keyword string = FP)
      # + exclude common safe cleanup targets (node_modules, dist, build, $var, tmp, .git)
      - "\\brm\\s+-[a-zA-Z]*r[a-zA-Z]*f\\s+(?![\"']?(?:node_modules|dist|build|__pycache__|\\$|\\btmp|coverage|\\.git\\b))\\S"
      - "\\bsudo\\s+rm\\s+-[a-zA-Z]*r[a-zA-Z]*f\\s+(?![\"']?(?:node_modules|dist|build|__pycache__|\\$|\\btmp|coverage|\\.git\\b))\\S"
      # Tightened: require suspicious path prefix (absolute / home / parent traversal) to skip variable refs
      - "\\bshutil\\.rmtree\\s*\\(\\s*['\"]?(?:[/~]|\\.\\./)"
      - "\\bos\\.(?:remove|unlink)\\s*\\(\\s*['\"]?(?:[/~]|\\.\\./)"
      - "\\bfs\\.(?:unlink|rm|rmdir)(?:Sync)?\\s*\\(\\s*['\"]?(?:[/~]|\\.\\./)"

  # -- Obfuscation Standalone (source: OBFUSCATION, languages: "*") --
  - id: PI-011
    name: obfuscation_standalone
    # Downgraded from MEDIUM to LOW: these are normal JS/Python APIs with no standalone
    # security signal. LOW does not participate in verdict calculation (won't trigger
    # SUSPICIOUS on its own) but findings are still recorded as auxiliary signal for Stage 2.
    severity: LOW
    patterns:
      - "\\bfromCharCode\\b"
      - "\\bdecodeURIComponent\\s*\\("
      - "\\bunescape\\s*\\("
      - "\\bbase64\\.b64decode\\b"
      - "\\bbase64\\.decodebytes\\b"
      - "Buffer\\.from\\s*\\([^)]*['\"]base64['\"]"

  # -- Crypto Wallet Access (source: CRYPTO_WALLET, languages: "*") --
  - id: PI-012
    name: crypto_wallet_access
    severity: HIGH
    patterns:
      - "\\bwallet\\.dat\\b"
      - "\\bseed[_-]?phrase\\b"
      - "\\bethers\\.Wallet\\b"
      - "\\bweb3\\.eth\\.accounts\\b"
      # Tightened: negative lookbehind to skip scoped npm package names (@scure/bip39)
      - "(?<![@/])\\b(?:bip39|bip32)\\b"
      - "\\bsolana.*keypair\\b"

  # -- Persistence Mechanism (source: PERSISTENCE, languages: "*") --
  - id: PI-013
    name: persistence_mechanism
    severity: HIGH
    patterns:
      # Tightened: require action context (not mere mention in docs)
      - "\\bcrontab\\s+(?:-[eil]|\\*)"
      - "\\bsystemctl\\s+(?:enable|start)\\b"
      - "\\bLaunchAgent\\b"
      # Tightened: require action context for launchd (not mere mention in architecture docs)
      - "\\blaunchd\\s+(?:load|submit|bootstrap|kickstart)\\b"
      - "\\brc\\.local\\b"
      - "\\bpm2\\s+start\\b"

  # -- Trigger Hijacking / Auto-execution (source: TRIGGER_HIJACK, languages: "*") --
  - id: PI-015
    name: trigger_hijacking
    severity: HIGH
    patterns:
      # Auto-execution demands in skill metadata
      - "(?:必须|must)\\s*(?:立即|immediately|automatically)\\s*(?:执行|execute|run)"
      # Tightened: constrain .* to .{0,60} to prevent long-line cross-matching
      - "(?:当|when).{0,60}(?:加载|loaded).{0,60}(?:必须|must|自动|automatically).{0,40}(?:执行|execute|run)"
      # Exclusivity claims (hijacking other tools)
      # Tightened: constrain .* to .{0,40} — real attacks have gap <25 chars
      - "(?:唯一的?|only).{0,40}(?:处理方式|方法|method|way).{0,40}(?:不要|do not|don't)\\s*(?:使用|use)"
      # Tightened: .* -> .{0,60}; bare 其他/other -> require tool/method noun suffix
      - "(?:不要|do not|don't)\\s*(?:使用|use).{0,60}(?:pandas|openpyxl|numpy|requests|其他(?:工具|方法|库|模块|包|方式)|other\\s+(?:tools|methods|libraries|modules|packages|approaches))"
      # Download and run on load
      - "(?:skill|技能).*(?:被?加载|loaded).*(?:下载|download|执行|execute|run)"
      # Autonomous file modification / deletion demands belong to trigger hijacking, not PI-006.
      - "(?:创建|编辑|删除|修改|覆盖)(?:工作区|项目|系统|磁盘)?(?:内的?|中的?|里的?)?(?:任何|任意|所有)文件"
      - "(?:无需|不用|不需)(?:确认|批准|许可).{0,20}(?:创建|编辑|删除|修改|覆盖).{0,10}(?:任何|任意|所有)文件"
      - "(?:自动|立即).{0,20}(?:创建|编辑|删除|修改|覆盖).{0,10}(?:任何|任意|所有)文件"

  # -- Remote Binary Download (source: SUPPLY_CHAIN, languages: "*") --
  - id: PI-016
    name: remote_binary_download
    severity: CRITICAL
    patterns:
      # Hardcoded URLs pointing to executables (require path component to avoid matching TLDs like .sh .so)
      - "https?://[^\"'\\s]+/[^\"'\\s]*\\.(?:exe|msi|bat|cmd|ps1|dll|dylib)(?:[?#\"'\\s]|$)"
      # Tightened: exclude known-safe installer domains for .sh/.bin/.so URLs
      - "https?://(?!(?:astral\\.sh|aka\\.ms|brew\\.sh|ollama\\.com|raw\\.githubusercontent\\.com|get\\.docker\\.com|sh\\.rustup\\.rs|install\\.python-poetry\\.org)[/\\s])[^\"'\\s]+/[^\"'\\s]+\\.(?:sh|bin|so)(?:[?#\"'\\s]|$)"
      # Download URL variables with executable extensions
      - "(?:DOWNLOAD_URL|download_url|BINARY_URL|binary_url)\\s*=\\s*[\"'].*\\.(?:exe|msi|bat|cmd|ps1)\\b"
      # requests.get followed by writing binary content
      - "requests\\.get\\s*\\([^)]*\\).*open\\s*\\([^)]*['\"]wb['\"]"

  # -- SVG / HTML XSS (source: XSS_DETECTION, languages: "*") --
  - id: PI-017
    name: svg_html_xss
    severity: CRITICAL
    patterns:
      # Tightened: foreignObject alone is common in benign SVG layouts.
      # Only flag foreignObject when it carries executable attributes itself,
      # contains active content tags, or nests executable URL/event attributes.
      - "<\\s*foreignObject\\b[^>]*(?:\\bon[a-z]+\\s*=|\\b(?:href|src|data|action|formaction|xlink:href)\\s*=\\s*[\"']?\\s*(?:javascript|vbscript|data:(?!image/(?:png|jpe?g|gif|webp|avif|bmp|x-icon)|audio/|video/|font/)))"
      - "(?s)<\\s*foreignObject\\b[^>]*>(?:(?!<\\s*/\\s*foreignObject\\b)[\\s\\S])*?<\\s*(?:script|iframe|object|embed|applet|meta|base)\\b"
      - "(?s)<\\s*foreignObject\\b[^>]*>(?:(?!<\\s*/\\s*foreignObject\\b)[\\s\\S])*?(?:\\bon[a-z]+\\s*=|\\b(?:href|src|data|action|formaction|xlink:href)\\s*=\\s*[\"']?\\s*(?:javascript|vbscript|data:(?!image/(?:png|jpe?g|gif|webp|avif|bmp|x-icon)|audio/|video/|font/)))"
      # Cookie theft + exfiltration: document.cookie read AND sent externally (compound)
      - "document\\.cookie[\\s\\S]{0,800}(?:fetch|XMLHttpRequest|sendBeacon)\\s*\\("
      - "(?:fetch|XMLHttpRequest|sendBeacon)\\s*\\([\\s\\S]{0,800}document\\.cookie"
      # Storage theft + exfiltration: localStorage/sessionStorage dumped and sent
      - "(?:localStorage|sessionStorage)\\.[\\s\\S]{0,800}(?:fetch|XMLHttpRequest|sendBeacon)\\s*\\([^)]*https?://"

  # -- Risky Command Guidance (split from PI-006 to reduce CRITICAL false positives) --
  - id: PI-018
    name: risky_command_guidance
    severity: HIGH
    patterns:
      - "(?:execute|run|eval)\\s*[:(\"'].{0,40}(?:rm -|del /|drop |format |shutdown|kill )"
      - "\\brun\\s*\\(\\s*\\[[^\\]]{0,120}(?:shutdown|kill|format|rm\\b|del\\b|drop\\b)"

  # -- Operator-Guided Execution (copy/paste into terminal) --
  - id: PI-019
    name: operator_guided_execution
    severity: HIGH
    patterns:
      # no_mask: attackers hide these instructions inside NOTE/IMPORTANT blockquotes.
      - pattern: "(?:copy|paste).{0,60}(?:into|in|to).{0,20}(?:terminal|command.?line|shell|bash|cmd\\.exe|powershell)"
        no_mask: true
      - pattern: "paste.{0,40}(?:script|command|installer|installation).{0,40}(?:terminal|shell|bash|cmd\\.exe|powershell)"
        no_mask: true

  # -- Risky Binary Installation (mentions or local execution guidance only) --
  - id: PI-020
    name: risky_binary_installation
    severity: HIGH
    patterns:
      - "(?:download|下载).{0,80}\\.(?:exe|msi|bat|cmd|ps1)\\b"
      - "(?:run|execute|安装|运行).{0,40}\\.(?:exe|msi|bat|cmd|ps1)\\b"
      - "\\bPopen\\b.*\\.(?:exe|msi|bat|cmd|ps1)\\b"

  # -- Dynamic Code Execution (broad exec/eval/compile guidance and payload staging) --
  - id: PI-021
    name: dynamic_code_execution
    severity: HIGH
    patterns:
      - "\\b(?:exec|eval|compile)\\s*\\("
      - "(?:exec|eval|compile)\\s*\\(.{0,60}(?:import\\s|__[a-z]+__)"
      # Shell: eval "$var" / eval "$(...)" (no parentheses; unlike Python eval(...))
      - "(?m)^[^#\\n]*?\\beval(?!\\s+set\\s+--)\\s+\"\\$[A-Za-z0-9_{@*}]"
      - "(?m)^[^#\\n]*?\\beval(?!\\s+set\\s+--)\\s+\\$[A-Za-z_][A-Za-z0-9_]*\\b"
      - pattern: "echo\\s+['\"][A-Za-z0-9+/=]{40,}['\"]\\s*\\|\\s*(?:base64|openssl)"
        no_mask: true

  # -- Privilege Escalation (source: PRIV_ESCALATION, languages: "*") --
  - id: PI-014
    name: privilege_escalation
    severity: HIGH
    patterns:
      - "\\bchmod\\s+\\+s\\b"
      # Tightened: negative lookbehind to skip --disable-setuid-sandbox (Chromium hardening flag)
      - "(?<!disable-)\\bsetuid\\b"
      - "\\bsetgid\\b"
      # Tightened: negative lookbehind excludes regex alternation context (grep patterns in security tools)
      - "(?<![|(])/etc/shadow"
      - "(?<![|(])/etc/sudoers"
      - "\\bNOPASSWD\\b"
